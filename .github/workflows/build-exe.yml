name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --uac-admin --icon assets/icon.ico --name ProcessRecorder --collect-all uiautomation main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProcessRecorder-exe
          path: dist/ProcessRecorder.exe
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProcessRecorder.exe
          generate_release_notes: true
