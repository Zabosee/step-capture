name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: pyinstaller --noconsole --onefile --uac-admin --icon assets/icon.ico --name ProcessRecorder --collect-all uiautomation main.py
      - name: exe signieren (nur mit Zertifikat-Secrets)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PW) {
            Write-Host "Keine Signatur-Secrets gesetzt - exe bleibt unsigniert."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:CERT_PW /tr http://timestamp.digicert.com /td SHA256 dist/ProcessRecorder.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $signtool verify /pa /v dist/ProcessRecorder.exe
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: ProcessRecorder-exe
          path: dist/ProcessRecorder.exe
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProcessRecorder.exe
          generate_release_notes: true
