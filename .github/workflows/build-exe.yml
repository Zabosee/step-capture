name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name ProcessRecorder --collect-all uiautomation main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProcessRecorder-exe
          path: dist/ProcessRecorder.exe
